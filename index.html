<!DOCTYPE html>
<html lang="fr"><head>
<meta http-equiv="content-type" content="text/html; charset=UTF-8">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" href="data:,">
<title>Terrain — Comptes rendus de visite</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Sora:wght@600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
/* ============ TOKENS ============ */
:root{
/* Charte ADEL — extraite du logo fourni */
--blue-900:#004F2A;
--blue-800:#006B34;
--blue-700:#00833F;
--blue-600:#0A9A4A;
--blue-500:#24A95B;
--blue-100:#D9F1E2;
--blue-50:#EFF9F2;
--green-700:#006B34;
--green-600:#00833F;
--green-100:#D9F1E2;
--green-50:#EFF9F2;
/* Rouge — 3e couleur de la charte (vert foncé / blanc / rouge) */
--amber-700:#A81F20;
--amber-600:#C82A2B;
--amber-100:#F7D6D6;
--amber-50:#FCEAEA;
--red-600:#C82A2B;
--red-100:#F7D6D6;
--red-50:#FCEAEA;
--ink-900:#151A21;
--ink-700:#333B46;
--ink-600:#5B6472;
--ink-500:#6E7785;
--ink-400:#8B94A3;
--ink-300:#B7BFC9;
--line:#E4E9E4;
--line-soft:#EFF3EF;
--bg:#F5F8F5;
--card:#FFFFFF;
--radius-sm:8px;
--radius-md:12px;
--radius-lg:18px;
--shadow-card:0 1px 2px rgba(0,79,42,.05), 0 1px 12px rgba(0,79,42,.07);
--font-display:'Sora',sans-serif;
--font-body:'Inter',sans-serif;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
font-family:var(--font-body);
background:var(--bg);
color:var(--ink-900);
-webkit-font-smoothing:antialiased;
}
h1,h2,h3,h4{font-family:var(--font-display);margin:0;color:var(--blue-900);}
p{margin:0;}
button{font-family:var(--font-body);cursor:pointer;}
input,textarea,select{font-family:var(--font-body);}
::selection{background:var(--blue-100);}
a{color:inherit;text-decoration:none;}
.icon{width:18px;height:18px;flex-shrink:0;}
.icon-sm{width:15px;height:15px;flex-shrink:0;}
/* ============ LAYOUT SHELL ============ */
#shell{display:flex;min-height:100vh;}
/* Sidebar */
#sidebar{
width:250px;flex-shrink:0;background:var(--card);
border-right:1px solid var(--line);
display:flex;flex-direction:column;
position:sticky;top:0;height:100vh;
}
.brand{
display:flex;align-items:center;gap:10px;
padding:22px 20px 18px 22px;border-bottom:1px solid var(--line-soft);
}
.brand-mark{
width:38px;height:38px;border-radius:10px;
background:linear-gradient(145deg,var(--blue-700) 0%,var(--blue-600) 68%,var(--amber-600) 100%);
display:flex;align-items:center;justify-content:center;flex-shrink:0;
}
.brand-mark svg{width:20px;height:20px;stroke:#fff;}
.brand-logo-wrap{width:48px;height:42px;display:flex;align-items:center;justify-content:center;overflow:hidden;border-radius:8px;background:#fff;flex-shrink:0;}
.brand-logo{width:64px;height:auto;display:block;}
.brand-text{line-height:1.15;}
.brand-text .b1{font-family:var(--font-display);font-weight:700;font-size:14.5px;color:var(--blue-900);letter-spacing:.2px;}
.brand-text .b2{font-size:10.5px;color:var(--ink-400);margin-top:1px;}
nav.nav{padding:14px 12px;flex:1;overflow-y:auto;}
.nav-item{
display:flex;align-items:center;gap:11px;
padding:10px 12px;border-radius:9px;margin-bottom:2px;
color:var(--ink-600);font-size:14px;font-weight:500;
cursor:pointer;transition:background .12s ease,color .12s ease;
border:none;background:none;width:100%;text-align:left;
}
.nav-item svg{stroke:var(--ink-400);transition:stroke .12s;}
.nav-item:hover{background:var(--blue-50);color:var(--blue-700);}
.nav-item:hover svg{stroke:var(--blue-700);}
.nav-item.active{background:var(--blue-700);color:#fff;}
.nav-item.active svg{stroke:#fff;}
.nav-section-label{
font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;
color:var(--ink-300);font-weight:600;padding:16px 12px 6px;
}
.sidebar-footer{
border-top:1px solid var(--line-soft);padding:14px 16px;
display:flex;align-items:center;gap:10px;
}
.avatar{
width:34px;height:34px;border-radius:50%;flex-shrink:0;
display:flex;align-items:center;justify-content:center;
color:#fff;font-weight:700;font-size:13px;font-family:var(--font-display);
}
.sf-user{flex:1;min-width:0;}
.sf-user .n{font-size:13px;font-weight:600;color:var(--ink-900);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.sf-user .r{font-size:11.5px;color:var(--ink-400);}
.role-switch{
width:100%;margin-top:10px;padding:7px 8px;border-radius:8px;
border:1px solid var(--line);background:var(--bg);font-size:12px;color:var(--ink-600);
}
/* Main column */
#main{flex:1;min-width:0;display:flex;flex-direction:column;}
/* Topbar */
#topbar{
display:flex;align-items:center;gap:16px;
padding:16px 30px;background:var(--card);border-bottom:1px solid var(--line);
position:sticky;top:0;z-index:20;
}
.search-box{
flex:1;max-width:520px;display:flex;align-items:center;gap:10px;
background:var(--bg);border:1px solid var(--line);border-radius:10px;
padding:9px 14px;color:var(--ink-400);
}
.search-box input{border:none;background:none;outline:none;font-size:13.5px;width:100%;color:var(--ink-900);}
.search-box svg{stroke:var(--ink-400);}
.topbar-spacer{flex:1;}
.topbar-right{display:flex;align-items:center;gap:18px;}
.bell-wrap{position:relative;display:flex;}
.icon-btn{
width:38px;height:38px;border-radius:9px;border:1px solid var(--line);
background:var(--card);display:flex;align-items:center;justify-content:center;
color:var(--ink-600);
}
.icon-btn svg{stroke:var(--ink-600);}
.badge-dot{
position:absolute;top:-4px;right:-4px;background:var(--red-600);color:#fff;
font-size:10px;font-weight:700;min-width:16px;height:16px;border-radius:8px;
display:flex;align-items:center;justify-content:center;padding:0 3px;
border:2px solid var(--card);
}
.date-pill{
display:flex;align-items:center;gap:8px;font-size:13px;color:var(--ink-600);
border:1px solid var(--line);padding:8px 13px;border-radius:9px;white-space:nowrap;
}
.date-pill svg{stroke:var(--blue-700);}
/* Notification dropdown */
.notif-panel{
position:absolute;top:46px;right:0;width:340px;max-height:420px;overflow-y:auto;
background:var(--card);border:1px solid var(--line);border-radius:var(--radius-md);
box-shadow:0 8px 30px rgba(0,79,42,.16);z-index:50;
}
.notif-panel .np-head{
padding:12px 16px;font-family:var(--font-display);font-weight:700;font-size:13px;
color:var(--blue-900);border-bottom:1px solid var(--line-soft);
}
.notif-item{
display:flex;gap:10px;align-items:flex-start;padding:12px 16px;
border-bottom:1px solid var(--line-soft);cursor:pointer;text-align:left;
width:100%;background:none;border-left:3px solid transparent;
}
.notif-item:hover{background:var(--blue-50);}
.notif-item.unread{background:var(--green-50);border-left-color:var(--blue-700);}
.notif-item .ni-icon{
width:30px;height:30px;border-radius:8px;flex-shrink:0;
display:flex;align-items:center;justify-content:center;background:var(--amber-50);
}
.notif-item .ni-body{flex:1;min-width:0;}
.notif-item .ni-text{font-size:12.8px;color:var(--ink-900);line-height:1.4;}
.notif-item .ni-time{font-size:11px;color:var(--ink-400);margin-top:2px;}
.notif-item .ni-link{font-size:11.5px;color:var(--blue-700);font-weight:600;margin-top:4px;}
.notif-empty{padding:26px 16px;text-align:center;color:var(--ink-400);font-size:13px;}
/* content */
#content{padding:26px 30px 60px;max-width:1400px;}
/* ============ REUSABLE ============ */
.page-head{display:flex;align-items:flex-start;justify-content:space-between;gap:20px;margin-bottom:22px;flex-wrap:wrap;}
.page-head h1{font-size:23px;}
.page-head .sub{color:var(--ink-600);font-size:14px;margin-top:4px;}
.btn{
display:inline-flex;align-items:center;gap:8px;padding:10px 16px;
border-radius:9px;font-size:13.5px;font-weight:600;border:1px solid transparent;
transition:filter .12s, background .12s; white-space:nowrap;
}
.btn svg{width:16px;height:16px;}
.btn-primary{background:var(--blue-700);color:#fff;}
.btn-primary:hover{background:var(--blue-800);}
.btn-primary svg{stroke:#fff;}
.btn-green{background:var(--green-600);color:#fff;}
.btn-green:hover{background:var(--green-700);}
.btn-green svg{stroke:#fff;}
.btn-outline{background:var(--card);color:var(--ink-700);border-color:var(--line);}
.btn-outline:hover{background:var(--bg);}
.btn-outline svg{stroke:var(--ink-600);}
.btn-yellow{background:var(--amber-100);color:var(--amber-700);border-color:var(--amber-100);}
.btn-yellow:hover{background:var(--amber-600);color:#fff;}
.btn-yellow svg{stroke:var(--amber-700);}
.btn-yellow:hover svg{stroke:#fff;}
.btn-ghost{background:transparent;color:var(--ink-600);}
.btn-ghost:hover{background:var(--bg);}
.btn-danger-outline{background:var(--card);color:var(--red-600);border-color:var(--red-100);}
.btn-danger-outline:hover{background:var(--red-50);}
.btn-sm{padding:7px 12px;font-size:12.5px;}
.btn:disabled{opacity:.5;cursor:not-allowed;}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius-lg);box-shadow:var(--shadow-card);}
.card-pad{padding:20px 22px;}
.section-title{display:flex;align-items:center;gap:10px;margin-bottom:14px;}
.section-title .ic{
width:30px;height:30px;border-radius:8px;display:flex;align-items:center;justify-content:center;flex-shrink:0;
}
.section-title h3{font-size:15.5px;color:var(--blue-900);}
.badge{
display:inline-flex;align-items:center;gap:6px;padding:4px 11px;border-radius:20px;
font-size:12px;font-weight:600;
}
.badge-green{background:var(--green-100);color:var(--green-700);}
.badge-amber{background:var(--amber-100);color:var(--amber-700);}
.badge-blue{background:var(--amber-100);color:var(--amber-700);}
.badge-gray{background:var(--line-soft);color:var(--ink-600);}
.badge-red{background:var(--red-100);color:var(--red-600);}
.badge svg{width:12px;height:12px;}
.toast-wrap{position:fixed;bottom:24px;right:24px;z-index:200;display:flex;flex-direction:column;gap:10px;}
.toast{
background:var(--blue-900);color:#fff;padding:13px 18px;border-radius:10px;
font-size:13.5px;box-shadow:0 10px 30px rgba(20,30,60,.25);
display:flex;align-items:center;gap:10px;max-width:360px;
animation:toastIn .25s ease;
}
.toast svg{stroke:var(--green-600);flex-shrink:0;}
@keyframes toastIn{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:translateY(0);}}
.empty-state{padding:50px 20px;text-align:center;color:var(--ink-400);}
.empty-state svg{stroke:var(--ink-300);margin-bottom:10px;}
.empty-state .t{font-size:14.5px;font-weight:600;color:var(--ink-600);margin-bottom:4px;}
.empty-state .d{font-size:13px;}
/* ============ DASHBOARD ============ */
.stat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:24px;}
.stat-card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius-lg);padding:18px 20px;box-shadow:var(--shadow-card);}
.stat-card .top{display:flex;justify-content:space-between;align-items:flex-start;}
.stat-icon{width:36px;height:36px;border-radius:9px;display:flex;align-items:center;justify-content:center;}
.stat-card .num{font-family:var(--font-display);font-size:28px;font-weight:700;color:var(--blue-900);margin-top:12px;}
.stat-card .lbl{font-size:12.5px;color:var(--ink-600);margin-top:2px;}
.stat-card .trend{font-size:11.5px;font-weight:600;padding:3px 8px;border-radius:6px;}
.dash-grid{display:grid;grid-template-columns:1.5fr 1fr;gap:20px;align-items:start;}
.list-row{
display:flex;align-items:center;gap:14px;padding:13px 4px;border-bottom:1px solid var(--line-soft);
}
.list-row:last-child{border-bottom:none;}
.list-row .r-icon{width:38px;height:38px;border-radius:9px;flex-shrink:0;display:flex;align-items:center;justify-content:center;}
.list-row .r-main{flex:1;min-width:0;}
.list-row .r-main .t1{font-size:13.5px;font-weight:600;color:var(--ink-900);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.list-row .r-main .t2{font-size:12px;color:var(--ink-400);margin-top:2px;}
.list-row:hover{background:var(--blue-50);border-radius:9px;cursor:pointer;}
.notif-item{padding:11px 4px;border-bottom:1px solid var(--line-soft);font-size:12.8px;color:var(--ink-600);display:flex;gap:9px;}
.notif-item:last-child{border-bottom:none;}
.notif-item svg{flex-shrink:0;margin-top:1px;}
.notif-item b{color:var(--ink-900);}
/* ============ REPORTS LIST ============ */
.filters-row{display:flex;gap:10px;margin-bottom:18px;flex-wrap:wrap;align-items:center;}
.chip{
padding:7px 14px;border-radius:20px;font-size:12.8px;font-weight:600;
border:1px solid var(--line);background:var(--card);color:var(--ink-600);
}
.chip.active{background:var(--blue-700);border-color:var(--blue-700);color:#fff;}
.reports-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:16px;}
.report-card{
background:var(--card);border:1px solid var(--line);border-radius:var(--radius-lg);
padding:19px 20px;box-shadow:var(--shadow-card);cursor:pointer;
display:flex;flex-direction:column;gap:12px;transition:transform .12s, box-shadow .12s;
}
.report-card:hover{transform:translateY(-2px);box-shadow:0 4px 18px rgba(20,30,60,.09);}
.report-card .rc-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;}
.report-card h4{font-size:15px;line-height:1.35;color:var(--blue-900);}
.report-card .rc-proj{font-size:12.5px;color:var(--ink-400);margin-top:3px;}
.rc-meta{display:flex;flex-direction:column;gap:6px;font-size:12.5px;color:var(--ink-600);}
.rc-meta div{display:flex;align-items:center;gap:7px;}
.rc-meta svg{stroke:var(--ink-400);flex-shrink:0;}
.rc-foot{display:flex;justify-content:space-between;align-items:center;border-top:1px solid var(--line-soft);padding-top:12px;font-size:12px;color:var(--ink-400);}
.rc-avatars{display:flex;}
.rc-avatars .mini-av{width:22px;height:22px;border-radius:50%;border:2px solid var(--card);margin-left:-7px;display:flex;align-items:center;justify-content:center;color:#fff;font-size:9px;font-weight:700;}
.rc-avatars .mini-av:first-child{margin-left:0;}
/* ============ REPORT DETAIL (mirrors reference layout) ============ */
.detail-head{background:var(--card);border:1px solid var(--line);border-radius:var(--radius-lg);box-shadow:var(--shadow-card);padding:22px 24px;margin-bottom:18px;}
.detail-head-top{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;flex-wrap:wrap;}
.detail-head-left{display:flex;gap:14px;align-items:flex-start;}
.detail-icon{width:46px;height:46px;border-radius:11px;background:var(--green-50);display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.detail-icon svg{stroke:var(--green-600);width:24px;height:24px;}
.detail-head h1{font-size:21px;}
.detail-head .proj{font-size:13.5px;color:var(--ink-600);margin-top:3px;}
.detail-actions{display:flex;gap:9px;flex-wrap:wrap;}
.meta-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-top:20px;}
.meta-box{display:flex;gap:11px;align-items:flex-start;background:var(--bg);border-radius:11px;padding:13px 14px;}
.meta-box .mi{width:34px;height:34px;border-radius:9px;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.meta-box .ml .k{font-size:11.5px;color:var(--ink-400);}
.meta-box .ml .v{font-size:13.5px;font-weight:700;color:var(--ink-900);margin-top:1px;line-height:1.3;}
.meta-box .ml .v2{font-size:11.5px;color:var(--ink-400);}
.detail-grid{display:grid;grid-template-columns:1.55fr 1fr;gap:18px;align-items:start;}
.stack{display:flex;flex-direction:column;gap:18px;}
.body-text{font-size:13.8px;line-height:1.75;color:var(--ink-700);}
.sub-h{font-size:13px;font-weight:700;color:var(--ink-900);margin:14px 0 7px;}
.sub-h:first-child{margin-top:0;}
ul.plain,ol.plain{margin:0;padding-left:20px;}
ul.plain li,ol.plain li{font-size:13.6px;color:var(--ink-700);line-height:1.7;}
.photo-block{margin-bottom:16px;}
.photo-block:last-child{margin-bottom:0;}
.photo-block img{width:100%;border-radius:12px;display:block;object-fit:cover;height:190px;background:var(--bg);}
.photo-block .cap{font-size:12.5px;color:var(--ink-600);margin-top:7px;}
.photo-block .cap b{color:var(--ink-900);}
table.results{width:100%;border-collapse:collapse;font-size:13px;}
table.results th{
text-align:left;font-size:11.5px;text-transform:none;color:var(--ink-400);
padding:8px 10px;border-bottom:1px solid var(--line);font-weight:600;
}
table.results td{padding:10px 10px;border-bottom:1px solid var(--line-soft);color:var(--ink-800);}
table.results tr:last-child td{border-bottom:none;}
.tag-note{
background:var(--card);border-radius:var(--radius-lg);border:1px solid;padding:16px 18px;
display:flex;flex-direction:column;gap:9px;
}
.tag-note .tn-head{display:flex;align-items:center;gap:9px;font-weight:700;font-size:13.5px;}
.tag-note ul{margin:0;padding-left:18px;}
.tag-note li{font-size:13px;line-height:1.6;}
.note-green{border-color:var(--green-100);background:var(--green-50);}
.note-green .tn-head{color:var(--green-700);}
.note-amber{border-color:var(--amber-100);background:var(--amber-50);}
.note-amber .tn-head{color:var(--amber-700);}
.note-blue{border-color:var(--blue-100);background:var(--blue-50);}
.note-blue .tn-head{color:var(--blue-700);}
.notes-row{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-top:18px;}
.validate-bar{
display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;
background:var(--amber-50);border:1px solid var(--amber-100);border-radius:var(--radius-lg);
padding:15px 20px;margin-bottom:18px;
}
.validate-bar .vb-text{display:flex;align-items:center;gap:11px;color:var(--amber-700);font-size:13.5px;font-weight:600;}
.validate-bar svg{stroke:var(--amber-600);flex-shrink:0;}
/* comments */
.comment{display:flex;gap:11px;padding:14px 0;border-bottom:1px solid var(--line-soft);}
.comment:last-child{border-bottom:none;}
.comment .c-body{flex:1;min-width:0;}
.comment .c-head{display:flex;align-items:center;gap:8px;}
.comment .c-name{font-size:13px;font-weight:700;color:var(--ink-900);}
.comment .c-time{font-size:11.5px;color:var(--ink-400);}
.comment .c-text{font-size:13.4px;color:var(--ink-700);margin-top:4px;line-height:1.6;}
.comment-form{display:flex;gap:11px;margin-top:14px;align-items:flex-start;}
.comment-form textarea{
flex:1;border:1px solid var(--line);border-radius:10px;padding:10px 13px;font-size:13.4px;
resize:vertical;min-height:44px;outline:none;color:var(--ink-900);
}
.comment-form textarea:focus{border-color:var(--blue-500);}
/* ============ FORM (nouveau compte rendu) ============ */
.form-shell{display:grid;grid-template-columns:1fr 320px;gap:20px;align-items:start;}
.field{margin-bottom:16px;}
.field label{display:block;font-size:12.8px;font-weight:600;color:var(--ink-700);margin-bottom:6px;}
.field .hint{font-size:11.5px;color:var(--ink-400);font-weight:400;margin-left:6px;}
.field input[type=text],.field input[type=date],.field input[type=number],.field textarea,.field select{
width:100%;border:1px solid var(--line);border-radius:9px;padding:10px 12px;font-size:13.5px;
color:var(--ink-900);outline:none;background:var(--card);
}
.field input:focus,.field textarea:focus,.field select:focus{border-color:var(--blue-500);}
.field textarea{resize:vertical;min-height:80px;line-height:1.6;}
.field-row2{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
.field-row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px;}
.dyn-list{display:flex;flex-direction:column;gap:8px;margin-bottom:8px;}
.dyn-row{display:flex;gap:8px;align-items:center;}
.dyn-row input{flex:1;}
.dyn-row .rm-btn{
width:32px;height:32px;border-radius:8px;border:1px solid var(--line);background:var(--card);
display:flex;align-items:center;justify-content:center;flex-shrink:0;color:var(--red-600);
}
.dyn-row .rm-btn svg{stroke:var(--red-600);}
.add-link{
display:inline-flex;align-items:center;gap:7px;font-size:12.8px;font-weight:600;color:var(--blue-700);
background:var(--blue-50);padding:8px 13px;border-radius:8px;border:1px dashed var(--blue-100);
}
.add-link svg{stroke:var(--blue-700);width:14px;height:14px;}
.results-table-edit{width:100%;border-collapse:collapse;margin-bottom:8px;}
.results-table-edit th{font-size:11px;color:var(--ink-400);text-align:left;padding:6px 6px;font-weight:600;}
.results-table-edit td{padding:5px 6px;}
.results-table-edit input{width:100%;padding:8px 9px;border:1px solid var(--line);border-radius:7px;font-size:12.8px;}
.results-table-edit .taux-cell{font-size:12.8px;font-weight:700;color:var(--ink-600);text-align:center;}
.photo-upload-zone{
border:1.5px dashed var(--line);border-radius:12px;padding:22px;text-align:center;
color:var(--ink-400);font-size:12.8px;cursor:pointer;background:var(--bg);
}
.photo-upload-zone svg{stroke:var(--ink-300);margin-bottom:6px;}
.photo-upload-zone:hover{border-color:var(--blue-500);color:var(--blue-600);}
.photo-thumbs{display:flex;flex-direction:column;gap:10px;margin-top:12px;}
.photo-thumb{display:flex;gap:10px;border:1px solid var(--line);border-radius:10px;padding:8px;align-items:center;}
.photo-thumb img{width:58px;height:58px;object-fit:cover;border-radius:7px;flex-shrink:0;background:var(--bg);}
.photo-thumb input{flex:1;border:none;background:none;font-size:12.5px;outline:none;color:var(--ink-900);}
.photo-thumb .rm-btn{width:28px;height:28px;}
.side-panel{position:sticky;top:88px;}
.side-panel .card{margin-bottom:16px;}
.progress-track{height:6px;background:var(--line-soft);border-radius:4px;overflow:hidden;margin-top:8px;}
.progress-fill{height:100%;background:linear-gradient(90deg,var(--blue-700),var(--blue-600));border-radius:4px;transition:width .3s;}
/* ============ TASKS ============ */
.tasks-table{width:100%;border-collapse:collapse;}
.tasks-table th{
text-align:left;font-size:11.5px;color:var(--ink-400);text-transform:none;
padding:11px 14px;border-bottom:1px solid var(--line);font-weight:600;background:var(--bg);
}
.tasks-table th:first-child{border-top-left-radius:12px;}
.tasks-table th:last-child{border-top-right-radius:12px;}
.tasks-table td{padding:13px 14px;border-bottom:1px solid var(--line-soft);font-size:13.3px;color:var(--ink-700);vertical-align:middle;}
.tasks-table tr:last-child td{border-bottom:none;}
.tasks-table tr:hover td{background:var(--blue-50);}
.priority-dot{width:8px;height:8px;border-radius:50%;display:inline-block;margin-right:7px;}
.assignee{display:flex;align-items:center;gap:9px;}
.assignee .mini-av{width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-size:10.5px;font-weight:700;flex-shrink:0;}
/* ============ TASK ROW ACTIONS + INLINE STATUS ============ */
.row-actions{display:flex;gap:6px;}
.icon-btn-sm{width:30px;height:30px;}
.icon-btn.danger:hover{background:var(--red-50);border-color:var(--red-100);}
.icon-btn.danger:hover svg{stroke:var(--red-600);}
.icon-btn.success{color:var(--blue-700);}
.icon-btn.success:hover{background:var(--blue-50);border-color:var(--blue-100);}
.resp-toolbar{display:flex;align-items:center;justify-content:space-between;gap:14px;margin-bottom:16px;flex-wrap:wrap;}
.resp-search{display:flex;align-items:center;gap:9px;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:9px 12px;min-width:260px;flex:1;max-width:420px;}
.resp-search input{border:0;outline:0;background:transparent;width:100%;font-size:13px;color:var(--ink-900);}
.resp-summary{display:flex;gap:8px;flex-wrap:wrap;}
.resp-empty{padding:56px 24px;}
.resp-guide{display:flex;gap:12px;align-items:flex-start;padding:14px 16px;margin-bottom:18px;border:1px solid var(--blue-100);background:var(--blue-50);border-radius:12px;color:var(--ink-700);font-size:12.8px;line-height:1.55;}
.resp-guide .guide-ic{width:32px;height:32px;border-radius:9px;background:var(--blue-700);color:#fff;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.status-pill{display:inline-flex;align-items:center;gap:6px;padding:4px 9px;border-radius:999px;font-size:11.5px;font-weight:700;}
.status-pill.active{background:var(--green-100);color:var(--green-700);}
.status-pill.inactive{background:var(--line-soft);color:var(--ink-500);}
.resp-name-cell{display:flex;align-items:center;gap:10px;}
.resp-avatar{width:34px;height:34px;border-radius:10px;display:flex;align-items:center;justify-content:center;color:#fff;font-size:11px;font-weight:800;flex-shrink:0;}
.status-select{
border:1px solid var(--line);border-radius:8px;padding:6px 9px;font-size:12.3px;font-weight:600;
outline:none;cursor:pointer;background:var(--card);color:var(--ink-700);
}
.status-select.badge-gray{background:var(--line-soft);border-color:var(--line-soft);color:var(--ink-600);}
.status-select.badge-blue{background:var(--amber-100);border-color:var(--amber-100);color:var(--amber-700);}
.status-select.badge-green{background:var(--green-100);border-color:var(--green-100);color:var(--green-700);}
/* ============ MODAL ============ */
.modal-overlay{
position:fixed;inset:0;background:rgba(15,20,35,.45);z-index:300;
display:flex;align-items:center;justify-content:center;padding:20px;
animation:overlayIn .15s ease;
}
@keyframes overlayIn{from{opacity:0;}to{opacity:1;}}
.modal-card{
background:var(--card);border-radius:var(--radius-lg);width:100%;max-width:520px;
box-shadow:0 20px 60px rgba(15,20,35,.3);max-height:90vh;overflow-y:auto;
animation:modalIn .18s ease;
}
@keyframes modalIn{from{opacity:0;transform:translateY(10px) scale(.98);}to{opacity:1;transform:translateY(0) scale(1);}}
.modal-head{display:flex;align-items:center;justify-content:space-between;padding:18px 22px;border-bottom:1px solid var(--line-soft);}
.modal-head h3{font-size:16px;}
.modal-body{padding:20px 22px;}
.modal-foot{display:flex;justify-content:flex-end;gap:10px;padding:16px 22px;border-top:1px solid var(--line-soft);}
/* responsive */
@media(max-width:1150px){
.detail-grid{grid-template-columns:1fr;}
.form-shell{grid-template-columns:1fr;}
.stat-grid{grid-template-columns:repeat(2,1fr);}
.meta-grid{grid-template-columns:repeat(2,1fr);}
.notes-row{grid-template-columns:1fr;}
}
@media(max-width:820px){
#sidebar{display:none;}
#content{padding:20px 16px 50px;}
#topbar{padding:14px 16px;}
.search-box{display:none;}
}
</style>
</head>

async function sbInsert(table, row){
if(!sb) return;
const {error} = await sb.from(table).insert(row);
if(error){ console.error(error); toast("Enregistrement Supabase impossible ("+table+"). Vérifiez votre connexion."); }
}
async function sbUpdate(table, row, id){
if(!sb) return;
const {error} = await sb.from(table).update(row).eq('id', id);
if(error){ console.error(error); toast("Mise à jour Supabase impossible ("+table+")."); }
}
async function sbDelete(table, id){
if(!sb) return;
const {error} = await sb.from(table).delete().eq('id', id);
if(error){ console.error(error); toast("Suppression Supabase impossible ("+table+")."); }
}
async function loadFromSupabase(){
if(!sb) return;
const [respRes, reportsRes, tasksRes, notifRes] = await Promise.all([
sb.from('responsables').select('*').order('created_at',{ascending:true}),
sb.from('reports').select('*').order('created_at',{ascending:false}),
sb.from('tasks').select('*'),
sb.from('notifications').select('*').order('created_at',{ascending:false}),
]);
if(respRes.error) throw respRes.error;
if(reportsRes.error) throw reportsRes.error;
if(tasksRes.error) throw tasksRes.error;
if(notifRes.error) throw notifRes.error;
DB.responsables = (respRes.data||[]).map(mapRespFromDb);
DB.reports = (reportsRes.data||[]).map(mapReportFromDb);
DB.tasks = (tasksRes.data||[]).map(mapTaskFromDb);
DB.notifications = (notifRes.data||[]).map(mapNotifFromDb);
}

function fmtDate(iso){
if(!iso) return '—';
const d=new Date(iso+'T00:00:00');
return d.toLocaleDateString('fr-FR',{day:'numeric',month:'long',year:'numeric'});
}
function fmtDateShort(iso){
const d=new Date(iso+'T00:00:00');
return d.toLocaleDateString('fr-FR',{day:'numeric',month:'short'});
}
function timeAgo(ts){
const s=Math.floor((Date.now()-ts)/1000);
if(s<60) return "à l'instant";
if(s<3600) return Math.floor(s/60)+' min';
if(s<86400) return Math.floor(s/3600)+' h';
return Math.floor(s/86400)+' j';
}

async function sendRealEmail(to, subject, html){
if(!sb){
throw new Error('Supabase n’est pas disponible.');
}
const { data:{ session } } = await sb.auth.getSession();
if(!session){
throw new Error('Session utilisateur introuvable.');
}
const response = await fetch(
`${SUPABASE_URL}/functions/v1/send-email`,
{
method:'POST',
headers:{
'Content-Type':'application/json',
'Authorization':`Bearer ${session.access_token}`,
'apikey':SUPABASE_ANON_KEY
},
body:JSON.stringify({
to,
subject,
html
})
}
);
const result = await response.json();
if(!response.ok || !result.success){
console.error('Erreur envoi e-mail :',result);
throw new Error(
result.error?.message ||
result.error ||
'Erreur lors de l’envoi de l’e-mail.'
);
}
return result;
}
async function notifyAllMembers(report){
const author=userById(report.createdBy);
/*
* Tous les utilisateurs sauf l'auteur du compte rendu
* et uniquement ceux qui possèdent une adresse e-mail.
*/
const recipients=DB.users.filter(
u=>u.id!==report.createdBy && u.email
);
/* Notifications internes */
const newNotifs=recipients.map(u=>({
id:uid('n'),
userId:u.id,
reportId:report.id,
text:`${author.name} a publié le compte rendu « ${report.title} »`,
createdAt:Date.now(),
read:false,
isEmail:true
}));
DB.notifications.push(...newNotifs);
if(sb){
for(const n of newNotifs){
await sbInsert(
'notifications',
mapNotifToDb(n)
);
}
} // fermeture du if(sb)
} // fermeture de notifyAllMembers
async function notifyCoordinators(report){
const author=userById(report.createdBy);
const recipients=DB.users.filter(
u=>u.role==='coordinateur' || u.role==='super_admin'
);
const newNotifs=recipients.map(u=>({
id:uid('n'),
userId:u.id,
reportId:report.id,
text:`${author.name} a soumis « ${report.title} » pour validation`,
createdAt:Date.now(),
read:false,
isEmail:true
}));
DB.notifications.push(...newNotifs);
if(sb){
for(const n of newNotifs){
await sbInsert('notifications', mapNotifToDb(n));
}
}
/* Envoi des vrais e-mails aux coordinateurs */
for(const member of recipients){
if(!member.email) continue;
const subject=
`Compte rendu à valider — ${report.title}`;
const html=`
<div style="font-family:Arial,sans-serif;max-width:650px;margin:auto;line-height:1.6">

<p>

pour validation.
</p>
<p>
Merci de le consulter dans le Gestionnaire des comptes rendus.
</p>
<p>
Cordialement,<br>
<strong>Gestionnaire des comptes rendus</strong>
</p>
</div>
`;
try{
await sendRealEmail(
member.email,
subject,
html
);
}catch(err){
console.error('Erreur envoi e-mail coordinateur:', err);
}
}
}

/* ======================================================================
FONCTION CORRIGÉE — openInviteModal(kind)
L'accolade de fermeture manquante à la fin a été ajoutée.
====================================================================== */
function openInviteModal(kind) {

  // kind = "coordinateur" ou "membre"

  const overlay = document.createElement('div');
  overlay.className = 'modal-overlay';

  const label =
    kind === 'coordinateur'
      ? 'coordinateur'
      : 'membre';

  overlay.innerHTML = `

    <div class="modal-card">

      <div class="modal-head">

        <h3>Ajouter un ${label}</h3>

        <button
          class="icon-btn"
          id="membreClose"
          type="button">
          ${icon('x', 'icon-sm')}
        </button>

      </div>

      <div class="modal-body">

        <div class="field">

          <label>
            Nom complet
            <span style="color:var(--red-600)">*</span>
          </label>

          <input
            type="text"
            id="membre-name"
            placeholder="Ex : Fatou Sarr"
            autocomplete="name"
            autofocus>

        </div>

        <div class="field">

          <label>Fonction</label>

          <input
            type="text"
            id="membre-fonction"
            placeholder="Ex : Animatrice terrain"
            autocomplete="organization-title">

        </div>

        <div class="field">

          <label>
            E-mail
            <span style="color:var(--red-600)">*</span>
          </label>

          <input
            type="email"
            id="membre-email"
            placeholder="nom@entreprise.sn"
            autocomplete="email">

        </div>

        <div class="hint">

          La personne recevra un e-mail avec un lien pour
          définir son mot de passe et accéder à l'application
          en tant que ${label}.

        </div>

      </div>

      <div class="modal-foot">

        <button
          class="btn btn-outline"
          id="membreCancel"
          type="button">
          Annuler
        </button>

        <button
          class="btn btn-primary"
          id="membreSave"
          type="button">
          ${icon('mail')} Envoyer l'invitation
        </button>

      </div>

    </div>

  `;

  document.body.appendChild(overlay);

  // ==========================================
  // FERMER LA FENÊTRE
  // ==========================================

  const close = () => overlay.remove();

  overlay.querySelector('#membreClose').onclick = close;
  overlay.querySelector('#membreCancel').onclick = close;

  // ==========================================
  // BOUTON ENVOYER
  // ==========================================

  overlay.querySelector('#membreSave').onclick = async () => {

    const name =
      overlay
        .querySelector('#membre-name')
        .value
        .trim();

    const email =
      overlay
        .querySelector('#membre-email')
        .value
        .trim()
        .toLowerCase();

    const fonction =
      overlay
        .querySelector('#membre-fonction')
        .value
        .trim();

    // ========================================
    // RÔLE
    // ========================================

    const role =
      kind === 'coordinateur'
        ? 'coordinateur'
        : 'membre';

    // ========================================
    // VALIDATION
    // ========================================

    if (!name || !email) {

      toast(
        'Le nom et l’e-mail sont obligatoires.'
      );

      return;
    }

    if (!/^\S+@\S+\.\S+$/.test(email)) {

      toast(
        'Veuillez saisir une adresse e-mail valide.'
      );

      return;
    }

    // ========================================
    // BOUTON EN CHARGEMENT
    // ========================================

    const saveBtn =
      overlay.querySelector('#membreSave');

    saveBtn.disabled = true;
    saveBtn.textContent = 'Envoi…';

    try {

      // ======================================
      // RÉCUPÉRATION DE LA SESSION
      // ======================================

      const {
        data: { session },
        error: sessionError
      } = await sb.auth.getSession();

      if (sessionError) {

        console.error(
          '[INVITE] Erreur session:',
          sessionError
        );

        toast(
          'Impossible de récupérer votre session.'
        );

        saveBtn.disabled = false;

        saveBtn.innerHTML =
          `${icon('mail')} Envoyer l'invitation`;

        return;
      }

      if (!session || !session.access_token) {

        console.error(
          '[INVITE] Aucune session active.'
        );

        toast(
          'Votre session a expiré. Veuillez vous reconnecter.'
        );

        saveBtn.disabled = false;

        saveBtn.innerHTML =
          `${icon('mail')} Envoyer l'invitation`;

        return;
      }

      // ======================================
      // URL DE RETOUR APRÈS ACTIVATION
      // ======================================

      const redirectTo =
        window.location.origin +
        window.location.pathname;

      console.log(
        '[INVITE] Envoi:',
        {
          name,
          email,
          fonction,
          role,
          redirectTo
        }
      );

      // ======================================
      // APPEL DE LA EDGE FUNCTION
      // ======================================

      const res = await fetch(

        `${SUPABASE_URL}/functions/v1/manage-member`,

        {
          method: 'POST',

          headers: {
            'Content-Type': 'application/json',
            'Authorization':
              `Bearer ${session.access_token}`,
            'apikey':
              SUPABASE_ANON_KEY
          },

          body: JSON.stringify({

            action: 'invite',

            name,

            email,

            fonction,

            role,

            redirectTo

          })
        }
      );

      // ======================================
      // LECTURE DE LA RÉPONSE
      // ======================================

      let result = {};

      try {

        result = await res.json();

      } catch (jsonError) {

        console.error(
          '[INVITE] Réponse non JSON:',
          jsonError
        );

      }

      console.log(
        '[INVITE] Réponse:',
        res.status,
        result
      );

      // ======================================
      // ERREUR SERVEUR
      // ======================================

      if (!res.ok) {

        const message =
          result?.error ||
          `Erreur serveur (${res.status}).`;

        console.error(
          '[INVITE] Échec:',
          message
        );

        toast(message);

        saveBtn.disabled = false;

        saveBtn.innerHTML =
          `${icon('mail')} Envoyer l'invitation`;

        return;
      }

      // ======================================
      // SUCCÈS
      // ======================================

      console.log(
        '[INVITE] Utilisateur créé:',
        result
      );

      toast(
        `Invitation envoyée à ${email}.`
      );

      close();

      // Actualiser la liste des membres

      if (typeof render === 'function') {

        await render();

      }

    } catch (error) {

      console.error(
        '[INVITE] Erreur:',
        error
      );

      toast(
        error?.message ||
        'Une erreur est survenue lors de l’envoi de l’invitation.'
      );

      saveBtn.disabled = false;

      saveBtn.innerHTML =
        `${icon('mail')} Envoyer l'invitation`;

    }

  };

}/* ====================================================================== */

async function callAdminManageUser(payload){
const {data:{session}} = await sb.auth.getSession();
const res = await fetch(`${SUPABASE_URL}/functions/v1/admin-manage-user`,{
method:'POST',
headers:{
'Content-Type':'application/json',
'Authorization':`Bearer ${session.access_token}`,
'apikey':SUPABASE_ANON_KEY,
},
body:JSON.stringify(payload),
});
const json=await res.json();
if(!res.ok){ toast(json.error||"Action impossible."); return null; }
return json;
}

function makeDynRow(container,placeholder,value=''){
const row=document.createElement('div');
row.className='dyn-row';
row.innerHTML=`<input type="text" placeholder="${placeholder}" value="${value.replace(/"/g,'&quot;')}"><button type="button" class="rm-btn">${icon('trash','icon-sm')}</button>`;
row.querySelector('.rm-btn').onclick=()=>{ if(container.children.length>1) row.remove(); else row.querySelector('input').value=''; };
container.appendChild(row);
}
function getDynValues(container){
return [...container.querySelectorAll('input')].map(i=>i.value.trim()).filter(Boolean);
}
let photoStore=[];
function renderPhotoThumbs(){
const wrap=document.getElementById('photoThumbs');
wrap.innerHTML=photoStore.map((p,i)=>`
<div class="photo-thumb">
<img src="${p.url}">
<input type="text" data-photo-caption="${i}" placeholder="Légende de la photo…" value="${p.caption.replace(/"/g,'&quot;')}">
<button type="button" class="rm-btn" data-photo-rm="${i}">${icon('trash','icon-sm')}</button>
</div>
`).join('');
wrap.querySelectorAll('[data-photo-caption]').forEach(inp=>{
inp.oninput=(e)=>{photoStore[+e.target.dataset.photoCaption].caption=e.target.value;};
});
wrap.querySelectorAll('[data-photo-rm]').forEach(btn=>{
btn.onclick=(e)=>{photoStore.splice(+e.target.closest('button').dataset.photoRm,1);renderPhotoThumbs();};
});
}
function addResultRow(data={indicateur:'',prevision:'',realisation:''}){
const tbody=document.getElementById('resultsBody');
const tr=document.createElement('tr');
tr.innerHTML=`
<td><input type="text" class="res-ind" placeholder="Ex : Femmes formées" value="${data.indicateur}"></td>
<td><input type="number" class="res-prev" placeholder="0" value="${data.prevision}"></td>
<td><input type="number" class="res-real" placeholder="0" value="${data.realisation}"></td>
<td class="taux-cell">—</td>
<td><button type="button" class="rm-btn">${icon('trash','icon-sm')}</button></td>
`;
const updateTaux=()=>{
const p=parseFloat(tr.querySelector('.res-prev').value);
const r=parseFloat(tr.querySelector('.res-real').value);
const cell=tr.querySelector('.taux-cell');
cell.textContent = (p>0 && !isNaN(r)) ? Math.round(r/p*100)+' %' : '—';
};
tr.querySelector('.res-prev').oninput=updateTaux;
tr.querySelector('.res-real').oninput=updateTaux;
tr.querySelector('.rm-btn').onclick=()=>{ if(tbody.children.length>1) tr.remove(); };
tbody.appendChild(tr);
updateTaux();
}

function collectReport(status){
const title=document.getElementById('f-title').value.trim()||'Compte rendu sans titre';
const results=[...document.getElementById('resultsBody').querySelectorAll('tr')].map(tr=>({
indicateur:tr.querySelector('.res-ind').value.trim(),
prevision:tr.querySelector('.res-prev').value?parseFloat(tr.querySelector('.res-prev').value):null,
realisation:tr.querySelector('.res-real').value?parseFloat(tr.querySelector('.res-real').value):0,
})).filter(r=>r.indicateur);
return {
id:uid('r'),
title,
project:document.getElementById('f-project').value.trim()||'—',
periodStart:document.getElementById('f-start').value||new Date().toISOString().slice(0,10),
periodEnd:document.getElementById('f-end').value||document.getElementById('f-start').value||new Date().toISOString().slice(0,10),
location:document.getElementById('f-location').value.trim()||'—',
region:document.getElementById('f-region').value.trim()||'',
beneficiaries:document.getElementById('f-beneficiaries').value.trim()||'—',
responsibleId:document.getElementById('f-responsible')?.value||'',
status,
createdBy:state.currentUserId,
createdAt:Date.now(),
contexte:document.getElementById('f-contexte').value.trim(),
objectifGeneral:document.getElementById('f-objgen').value.trim(),
objectifsSpecifiques:getDynValues(document.getElementById('objList')),
dateHoraires:document.getElementById('f-dates').value.trim(),
etapes:getDynValues(document.getElementById('stepList')),
methodes:document.getElementById('f-methodes').value.trim(),
moyens:document.getElementById('f-moyens').value.trim(),
photos:photoStore.map(p=>({url:p.url,caption:p.caption||'Photo de la visite'})),
resultats:results,
pointsForts:getDynValues(document.getElementById('strengthsList')),
difficultes:getDynValues(document.getElementById('issuesList')),
recommandations:getDynValues(document.getElementById('recsList')),
comments:[],
};
}
document.getElementById('submitReportBtn').onclick=()=>{
if(!DB.responsables.some(r=>r.actif!==false)){toast('Aucun responsable actif n’est disponible. Le coordinateur doit d’abord compléter ou réactiver la liste.');return;}
if(!document.getElementById('f-responsible')?.value){toast('Veuillez sélectionner un responsable de mission.');return;}
const report=collectReport('en_attente');
DB.reports.unshift(report);
notifyCoordinators(report);
toast('Compte rendu envoyé au coordinateur pour validation.');
sbInsert('reports', mapReportToDb(report));
setView('report-detail',{activeReportId:report.id});
};
document.getElementById('draftReportBtn').onclick=()=>{
if(!DB.responsables.some(r=>r.actif!==false)){toast('Aucun responsable actif n’est disponible. Le coordinateur doit d’abord compléter ou réactiver la liste.');return;}
if(!document.getElementById('f-responsible')?.value){toast('Veuillez sélectionner un responsable de mission.');return;}
const report=collectReport('brouillon');
DB.reports.unshift(report);
toast('Brouillon enregistré. Vous pourrez le compléter plus tard.');
sbInsert('reports', mapReportToDb(report));
setView('reports');
};
}
function renderContent(){
const c=document.getElementById('content');
if(state.view==='dashboard') c.innerHTML=viewDashboard();
else if(state.view==='reports') c.innerHTML=viewReportsList();
else if(state.view==='report-detail') c.innerHTML=viewReportDetail();
else if(state.view==='new-report') c.innerHTML=viewNewReport();
else if(state.view==='tasks') c.innerHTML=viewTasks();
else if(state.view==='responsables'){ c.innerHTML=viewResponsables(); wireResponsables(); }
else if(state.view==='membres'){ c.innerHTML=viewMembres(); wireMembres(); }
else if(state.view==='coordinateurs'){ c.innerHTML=viewCoordinateurs(); wireCoordinateurs(); }
else if(state.view==='utilisateurs'){ c.innerHTML=viewUtilisateurs(); wireUtilisateurs(); }
c.querySelectorAll('[data-nav]').forEach(b=>b.onclick=()=>setView(b.dataset.nav));
c.querySelectorAll('[data-goto-report]').forEach(b=>b.onclick=()=>setView('report-detail',{activeReportId:b.dataset.gotoReport}));
c.querySelectorAll('[data-filter]').forEach(b=>b.onclick=()=>{state.reportFilter=b.dataset.filter;renderContent();});
c.querySelectorAll('[data-edit-report]').forEach(b=>b.onclick=()=>toast("L'édition de brouillon est disponible dans la version connectée à la base de données."));
if(state.view==='new-report') wireNewReportForm();
if(state.view==='tasks'){
const addBtn=document.getElementById('addTaskBtn');
if(addBtn) addBtn.onclick=()=>openTaskModal();
c.querySelectorAll('[data-edit-task]').forEach(b=>b.onclick=()=>{
const t=DB.tasks.find(x=>x.id===b.dataset.editTask);
if(t) openTaskModal(t);
});
c.querySelectorAll('[data-del-task]').forEach(b=>b.onclick=()=>{
const t=DB.tasks.find(x=>x.id===b.dataset.delTask);
if(t && confirm(`Supprimer la tâche « ${t.title} » ?`)){
DB.tasks=DB.tasks.filter(x=>x.id!==t.id);
toast('Tâche supprimée.');
sbDelete('tasks', t.id);
renderContent();
}
});
c.querySelectorAll('[data-status-task]').forEach(sel=>sel.onchange=(e)=>{
const t=DB.tasks.find(x=>x.id===e.target.dataset.statusTask);
if(t){
t.status=e.target.value;
e.target.className='status-select '+STATUS_CLASS[t.status];
toast('Statut mis à jour.');
sbUpdate('tasks', {status:t.status}, t.id);
}
});
}
if(state.view==='report-detail'){
const r=DB.reports.find(x=>x.id===state.activeReportId);
const validateBtn=document.getElementById('validateBtn');
if(validateBtn){
validateBtn.onclick=async()=>{
if(!r){
toast('Compte rendu introuvable.','error');
return;
}
validateBtn.disabled=true;
validateBtn.textContent='Envoi en cours...';
try{
// Publier le compte rendu
r.status='publie';
r.publishedAt=Date.now();
// Sauvegarder le statut dans Supabase
await sbUpdate(
'reports',
{
status:r.status,
published_at:r.publishedAt
},
r.id
);
// Envoyer les vrais e-mails
await notifyAllMembers(r);
toast(
'Compte rendu validé et envoyé par e-mail aux membres.',
'mail'
);
renderContent();
renderTopbar();
renderSidebar();
}catch(error){
console.error(
'Erreur validation compte rendu :',
error
);
toast(
'Erreur lors de l’envoi du compte rendu par e-mail.',
'error'
);
validateBtn.disabled=false;
validateBtn.textContent='Valider & publier';
}
};
}
const rejectBtn=document.getElementById('rejectBtn');
if(rejectBtn){
rejectBtn.onclick=()=>{
r.status='brouillon';
toast(
'Compte rendu renvoyé à son auteur pour révision.'
);
sbUpdate(
'reports',
{
status:r.status
},
r.id
);
setView('reports');
};
}
const postBtn=document.getElementById('postCommentBtn');
if(postBtn){
postBtn.onclick=()=>{
const ta=document.getElementById('newCommentText');
const text=ta.value.trim();
if(!text){
return;
}
r.comments.push({
id:uid('c'),
authorId:state.currentUserId,
text,
createdAt:Date.now()
});
toast('Commentaire ajouté.');
sbUpdate(
'reports',
{
comments:r.comments
},
r.id
);
renderContent();
};
}
}
}

#authScreen .auth-status-dot{width:7px;height:7px;border-radius:50%;background:#7c8b6f;box-shadow:0 0 0 4px rgba(124,139,111,.10);}

#authScreen .auth-metric strong{display:block;color:#e7e0cf;font-size:15px;margin-bottom:3px;}
#authScreen .auth-metric span{font-size:9px;letter-spacing:.09em;text-transform:uppercase;color:#8f978b;}
#authScreen .auth-form-panel{
min-height:100vh;display:flex;align-items:center;justify-content:center;
padding:42px;background:#f4f1e9;color:#152019;
}
#authScreen .auth-form-box{width:100%;max-width:410px;}
#authScreen .auth-form-header{margin-bottom:32px;}
#authScreen .auth-form-kicker{
margin-bottom:9px;color:#c07a34;font-size:10px;font-weight:800;
letter-spacing:.14em;text-transform:uppercase;
}
#authScreen .auth-form-title{
margin:0;color:#152019;font-size:31px;line-height:1.1;letter-spacing:-.035em;font-weight:800;
}

#authScreen .auth-field label{display:block;margin-bottom:7px;color:#263129;font-size:11px;font-weight:750;}
#authScreen .auth-input{
width:100%;height:48px;padding:0 14px;border:1px solid #d9d6ce;border-radius:10px;
outline:none;background:#fff;color:#152019;font-size:14px;
transition:border-color .18s,box-shadow .18s;
}
#authScreen .auth-input:focus{border-color:#c07a34;box-shadow:0 0 0 3px rgba(192,122,52,.10);}

</style>
<div class="auth-layout">
<section class="auth-visual">
<div class="auth-brand">
<div class="auth-brand-mark">T</div>
<div>
<div class="auth-brand-name">TERRAIN SUITE</div>
<div class="auth-brand-sub">Gestion des missions</div>
</div>
</div>
<div class="auth-hero">
<div class="auth-eyebrow"><span class="auth-dot"></span> Plateforme opérationnelle</div>
<h1 class="auth-title">Chaque mission,<br><span>un compte rendu.</span></h1>
<p class="auth-description">
Centralisez vos missions de terrain, vos comptes rendus,
vos équipes et vos activités dans un espace de travail
simple, structuré et accessible.
</p>
</div>
<div class="auth-footer">
<div class="auth-status"><span class="auth-status-dot"></span> Système opérationnel</div>
<div class="auth-metrics">
<div class="auth-metric"><strong>04</strong><span>Missions actives</span></div>
<div class="auth-metric"><strong id="authClock">--:--</strong><span>Heure locale</span></div>
</div>
</div>
</section>
<section class="auth-form-panel">
<div class="auth-form-box">
<div class="auth-form-header">
<div class="auth-form-kicker">${isSetPw ? 'Activation du compte' : 'Espace sécurisé'}</div>
<h2 class="auth-form-title">${isSetPw ? 'Activez votre compte' : 'Bienvenue'}</h2>
<p class="auth-form-subtitle">
${isSetPw
? 'Définissez votre mot de passe pour accéder à votre espace.'
: 'Connectez-vous pour accéder à votre espace de travail.'}
</p>
</div>
${isSetPw ? `
<div class="auth-field">
<label for="authPw1">Nouveau mot de passe</label>
<input id="authPw1" class="auth-input" type="password" placeholder="8 caractères minimum" autocomplete="new-password" autofocus>
</div>
<div class="auth-field">
<label for="authPw2">Confirmez le mot de passe</label>
<input id="authPw2" class="auth-input" type="password" placeholder="Retapez votre mot de passe" autocomplete="new-password">
</div>
<button class="auth-submit" id="authSubmit" type="button">Activer mon compte</button>
` : `
<div class="auth-field">
<label for="authEmail">E-mail</label>
<input id="authEmail" class="auth-input" type="email" placeholder="vous@entreprise.sn" autocomplete="email" autofocus>
</div>
<div class="auth-field">
<label for="authPw">Mot de passe</label>
<input id="authPw" class="auth-input" type="password" placeholder="Votre mot de passe" autocomplete="current-password">
</div>
<button class="auth-submit" id="authSubmit" type="button">Se connecter</button>
`}
<div id="authError" class="auth-error">${errorMsg || ''}</div>
<div class="auth-note">
${isSetPw
? 'Votre compte sera activé après la définition du mot de passe.'
: 'Accès réservé aux membres autorisés de la plateforme.'}
</div>
</div>
</section>
</div>
`;
const submit = isSetPw ? submitSetPassword : submitLogin;
const submitBtn = document.getElementById('authSubmit');
if(submitBtn){ submitBtn.onclick = submit; }
el.querySelectorAll('input').forEach(inp=>{
inp.addEventListener('keydown',e=>{
if(e.key === 'Enter'){ e.preventDefault(); submit(); }
});
});
const clockEl = document.getElementById('authClock');
if(clockEl){
const updateClock = ()=>{
const now = new Date();
clockEl.textContent = now.toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'});
};
updateClock();
const oldTimer = window.__terrainAuthClockTimer;
if(oldTimer){ clearInterval(oldTimer); }
window.__terrainAuthClockTimer = setInterval(updateClock,30000);
}
}
async function submitLogin(){
const email=document.getElementById('authEmail').value.trim();
const pw=document.getElementById('authPw').value;
const errEl=document.getElementById('authError');
errEl.textContent='';
if(!email || !pw){ errEl.textContent='Renseignez votre e-mail et votre mot de passe.'; return; }
const {error}=await sb.auth.signInWithPassword({email,password:pw});
if(error){
console.error('[AUTH LOGIN]', error);
errEl.textContent = error.message || 'Erreur de connexion.';
return;
}
}
async function submitSetPassword(){
const pw1=document.getElementById('authPw1').value;
const pw2=document.getElementById('authPw2').value;
const errEl=document.getElementById('authError');
errEl.textContent='';
if(pw1.length<8){ errEl.textContent='8 caractères minimum.'; return; }
if(pw1!==pw2){ errEl.textContent='Les mots de passe ne correspondent pas.'; return; }
const {error}=await sb.auth.updateUser({password:pw1});
if(error){ errEl.textContent=error.message; return; }
pendingPasswordSetup=false;
toast('Compte activé, bienvenue !');
await startApp();
}
async function logout(){
await sb.auth.signOut();
}
async function startApp(){
try{
await loadProfiles();
await loadFromSupabase();
}catch(e){
console.error(e);
toast("Connexion à Supabase impossible.");
}
document.getElementById('authScreen').style.display='none';
document.getElementById('shell').style.display='flex';
render();
}
(function init(){
if(!sb){
renderAuthScreen('login', "Supabase n'est pas configuré : vérifiez SUPABASE_URL et SUPABASE_ANON_KEY en haut du fichier.");
return;
}
if(initialAuthHash.includes('type=invite') || initialAuthHash.includes('type=recovery')){
pendingPasswordSetup=true;
}
sb.auth.onAuthStateChange((event,session)=>{
if(!session){
state.currentUserId=null;
renderAuthScreen('login');
return;
}
state.currentUserId=session.user.id;
if(pendingPasswordSetup){
renderAuthScreen('set-password');
}else{
startApp();
}
});
})();
</script>
</body></html>
